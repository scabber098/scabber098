name: generate github-snake

on:
  schedule:
    # every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate snake svg(s)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: scabber098
          outputs: |
            dist/github-snake.svg?color_snake=#ff6ec7&color_dots=#1a1f47,#3a2f7c,#6c4fd6,#a855f7,#ff6ec7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff6ec7
            dist/github-snake-light.svg?palette=github-light&color_snake=#a855f7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push snake svg(s) to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
