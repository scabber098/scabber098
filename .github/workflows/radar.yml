name: Generate Skill Radar

on:
  push:
    paths:
      - "assets/skills.json"
      - "scripts/radar.py"
      - ".github/workflows/radar.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate radar charts
        run: python scripts/radar.py

      - name: Commit generated charts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update skill radar charts"
          git push
